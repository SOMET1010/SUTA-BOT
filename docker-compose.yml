services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: suta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: suta
      POSTGRES_PASSWORD: suta
      POSTGRES_DB: suta
    ports:
      - "5432:5432"
    volumes:
      - suta-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suta -d suta"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  suta-postgres-data:
